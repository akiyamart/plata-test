services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes
      POSTGRES_DB: quotes
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://quotes:quotes@postgres:5432/quotes?sslmode=disable
      FX_BASE_URL: https://api.exchangerate.dev
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
      MIGRATIONS_DIR: /app/migrations
      WORKER_INTERVAL_MS: "300"
    depends_on:
      postgres:
        condition: service_healthy

  # OpenAPI UI: http://localhost:8081
  swagger:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    volumes:
      - ./api/openapi.yaml:/api/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /api/openapi.yaml
